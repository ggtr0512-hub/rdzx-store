<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RDZX HORROR 3D</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  color:#eee;
  font-family:Arial,sans-serif;
  background:#020204;
}

#cena{
  position:fixed;
  inset:0;
  overflow:hidden;
  perspective:700px;
  background:
    radial-gradient(circle at 50% 45%,#57132133,transparent 28%),
    #020204;
}

.nevoa{
  position:absolute;
  inset:-20%;
  opacity:.35;
  background:
    radial-gradient(ellipse,#8d263522,transparent 35%),
    radial-gradient(ellipse at 70% 60%,#b9283820,transparent 30%);
  filter:blur(35px);
  animation:nevoa 8s ease-in-out infinite alternate;
}

@keyframes nevoa{
  from{transform:translate(-3%,2%) scale(1)}
  to{transform:translate(4%,-2%) scale(1.12)}
}

.corredor{
  position:absolute;
  inset:12% 12% 0;
  transform-style:preserve-3d;
  transform:rotateX(4deg);
}

.parede{
  position:absolute;
  background:linear-gradient(90deg,#09080b,#211017,#09080b);
  border:1px solid #6b1b2c55;
}

.parede.esquerda{
  left:0;
  top:0;
  width:50%;
  height:100%;
  transform-origin:left;
  transform:rotateY(72deg);
}

.parede.direita{
  right:0;
  top:0;
  width:50%;
  height:100%;
  transform-origin:right;
  transform:rotateY(-72deg);
}

.fundo{
  position:absolute;
  top:0;
  left:25%;
  width:50%;
  height:100%;
  background:#10090d;
  border:1px solid #721a2d;
}

.chao{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:58%;
  transform-origin:bottom;
  transform:rotateX(62deg);
  background:
    repeating-linear-gradient(90deg,#210d14 0 1px,transparent 1px 75px),
    repeating-linear-gradient(0deg,#210d14 0 1px,transparent 1px 55px),
    #080609;
}

.luz{
  position:absolute;
  top:8%;
  left:48%;
  width:6px;
  height:100px;
  background:#ef233c;
  box-shadow:0 0 24px #ef233c;
  animation:piscando 2.5s infinite;
}

@keyframes piscando{
  0%,45%,100%{opacity:1}
  48%,52%{opacity:.15}
}

.porco{
  position:absolute;
  z-index:4;
  left:50%;
  top:45%;
  width:115px;
  height:105px;
  transform:translate(-50%,-50%) translateZ(100px);
  border-radius:48% 48% 42% 42%;
  background:radial-gradient(circle at 35% 30%,#794050,#260e18 65%);
  box-shadow:0 0 30px #a9233e77;
  animation:respirar 2.8s ease-in-out infinite;
}

@keyframes respirar{
  50%{transform:translate(-50%,-50%) translateZ(100px) scale(1.04)}
}

.porco:before,
.porco:after{
  content:"";
  position:absolute;
  top:18px;
  width:28px;
  height:35px;
  border-radius:70% 20%;
  background:#491722;
}
.porco:before{left:12px;transform:rotate(-25deg)}
.porco:after{right:12px;transform:rotate(25deg)}

.olho{
  position:absolute;
  top:43px;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#ff253f;
  box-shadow:0 0 15px #ff253f;
}
.olho.a{left:29px}
.olho.b{right:29px}

.focinho{
  position:absolute;
  bottom:14px;
  left:35px;
  width:45px;
  height:25px;
  border-radius:50%;
  background:#6c2638;
  box-shadow:inset 0 0 0 3px #32101b;
}

.focinho:after{
  content:"•  •";
  color:#13070b;
  letter-spacing:8px;
}

.painel{
  position:relative;
  z-index:10;
  display:grid;
  place-items:center;
  min-height:100vh;
  padding:20px;
  text-align:center;
  background:#0008;
}

.caixa{
  width:min(600px,100%);
  padding:34px 22px;
  border:1px solid #a72740aa;
  border-radius:22px;
  background:#080609dd;
  box-shadow:0 0 45px #9d1f3888;
}

h1{
  color:#ff5268;
  font-size:clamp(28px,8vw,58px);
  letter-spacing:3px;
  text-shadow:0 0 20px #ef233c;
}

p{
  color:#c5b7bc;
  line-height:1.6;
}

button{
  margin-top:18px;
  padding:14px 22px;
  border:1px solid #ef233c;
  border-radius:12px;
  color:#fff;
  background:#601424;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#8e1b32;
  box-shadow:0 0 25px #ef233c;
}

#jogo{
  display:none;
}

.aviso{
  font-size:13px;
  color:#998b91;
}
</style>
</head>

<body>
<div id="cena">
  <div class="nevoa"></div>

  <div class="corredor">
    <div class="parede esquerda"></div>
    <div class="parede direita"></div>
    <div class="fundo"></div>
    <div class="chao"></div>
    <div class="luz"></div>

    <div class="porco">
      <i class="olho a"></i>
      <i class="olho b"></i>
      <div class="focinho"></div>
    </div>
  </div>

  <div class="painel">
    <div class="caixa" id="entrada">
      <h1>👻 RDZX HORROR 3D</h1>
      <p>Uma experiência fictícia de terror e suspense criada para entretenimento.</p>
      <p class="aviso">Pode conter sons repentinos, efeitos assustadores e sustos leves.</p>
      <button onclick="entrar()">👁️ ENTRAR NO HORROR</button>
    </div>

    <div class="caixa" id="jogo">
      <h1>HORROR CORE</h1>
      <p>O ambiente está observando você.</p>
      <button onclick="voltar()">Voltar para a loja</button>
    </div>
  </div>
</div>

<script>
function entrar(){
  document.getElementById("entrada").style.display="none";
  document.getElementById("jogo").style.display="block";

  var AC=window.AudioContext||window.webkitAudioContext;
  if(AC){
    var audio=new AC();
    var oscilador=audio.createOscillator();
    var ganho=audio.createGain();

    oscilador.frequency.value=95;
    ganho.gain.value=.025;
    oscilador.connect(ganho);
    ganho.connect(audio.destination);
    oscilador.start();
    oscilador.stop(audio.currentTime+.35);
  }
}

function voltar(){
  window.location.href="../index.html";
}
</script>
</body>
</html>
