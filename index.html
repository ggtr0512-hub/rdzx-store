<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RDZX STORE ⚡ — Manutenção</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#7c3cff55,transparent 60%),
    radial-gradient(circle at 0% 100%,#e64cff22,transparent 55%),
    #07030f;
}

main{
  width:min(760px,100%);
  text-align:center;
}

.logo{
  margin-bottom:20px;
  color:#c9a7ff;
  font-size:14px;
  font-weight:900;
  letter-spacing:2px;
}

h1{
  margin:22px 0 10px;
  font-size:clamp(30px,8vw,58px);
  line-height:1;
  text-shadow:0 0 28px #9b5cff99;
}

p{
  color:#c9bdd8;
  line-height:1.7;
  font-size:15px;
}

.video-box{
  overflow:hidden;
  border:1px solid #ffffff22;
  border-radius:22px;
  background:#09050f;
  box-shadow:0 0 45px #7c3cff55,0 20px 60px #000b;
}

video,
#foto-final{
  display:block;
  width:100%;
  max-height:68vh;
  object-fit:contain;
}

#foto-final{
  display:none;
}

.controles{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0;
}

button{
  border:1px solid #ffffff33;
  border-radius:14px;
  padding:13px 17px;
  color:#fff;
  background:linear-gradient(110deg,#713cff,#c13cff,#477dff);
  background-size:200% 100%;
  font-weight:900;
  box-shadow:0 0 20px #9b5cff66;
  transition:.25s;
}

button:hover{
  transform:translateY(-3px);
  background-position:100% 0;
  box-shadow:0 0 35px #e64cffbb;
}

#som{
  animation:brilho 1.7s ease-in-out infinite alternate;
}

@keyframes brilho{
  from{box-shadow:0 0 12px #55d9ff99,0 0 25px #9b5cff66}
  to{box-shadow:0 0 25px #55d9ff,0 0 48px #e64cffcc}
}

.aviso{
  margin:20px auto;
  padding:16px;
  border:1px solid #ffffff18;
  border-radius:16px;
  color:#d7cbe5;
  background:#ffffff09;
  line-height:1.6;
}

.contatos{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:22px;
}

.contatos button{
  min-width:180px;
}

.numero{
  margin-top:17px;
  color:#aFA2c2;
  font-size:13px;
  line-height:1.8;
}

@media(max-width:600px){
  body{padding:14px}
  .controles,.contatos{
    display:grid;
    grid-template-columns:1fr 1fr;
  }
  button{
    width:100%;
    padding:13px 8px;
    font-size:12px;
  }
  .contatos button{
    min-width:0;
  }
}
</style>
</head>

<body>
<main>
  <div class="logo">RDZX STORE ⚡</div>

  <div class="video-box">
    <video id="video" autoplay muted playsinline preload="metadata">
      <source src="videos/6762.mp4" type="video/mp4">
    </video>

    <img id="foto-final" src="imagens/manutencao.jpg" alt="RDZX STORE em manutenção">
  </div>

  <div class="controles">
    <button id="som">🔊 Ativar som</button>
    <button id="pausar">⏸ Pausar vídeo</button>
    <button id="repetir">↻ Assistir novamente</button>
  </div>

  <h1>Estamos preparando novidades</h1>

  <p>
    A RDZX STORE está passando por uma atualização.
    Em breve voltaremos com uma experiência ainda melhor.
  </p>

  <div class="aviso">
    Para comprar ou tirar dúvidas, entre em contato pelos canais abaixo.
  </div>

  <div class="contatos">
    <button onclick="copiar('5594991588787')">💬 WhatsApp</button>
    <button onclick="copiar('5594984438697')">🛟 Suporte</button>
  </div>

  <div class="numero">
    Toque em um botão para copiar o contato.
  </div>
</main>

<script>
var video=document.getElementById("video");
var foto=document.getElementById("foto-final");
var som=document.getElementById("som");
var pausar=document.getElementById("pausar");
var repetir=document.getElementById("repetir");

video.addEventListener("ended",function(){
  video.style.display="none";
  foto.style.display="block";
});

som.onclick=function(){
  video.muted=!video.muted;

  if(video.muted){
    som.textContent="🔊 Ativar som";
  }else{
    som.textContent="🔇 Desativar som";
    video.play().catch(function(){});
  }
};

pausar.onclick=function(){
  if(video.paused){
    video.play().catch(function(){});
    pausar.textContent="⏸ Pausar vídeo";
  }else{
    video.pause();
    pausar.textContent="▶ Continuar vídeo";
  }
};

repetir.onclick=function(){
  foto.style.display="none";
  video.style.display="block";
  video.currentTime=0;
  video.play().catch(function(){});
  pausar.textContent="⏸ Pausar vídeo";
};

function copiar(numero){
  navigator.clipboard.writeText(numero);
  alert("Contato copiado.");
}
</script>
</body>
</html>
